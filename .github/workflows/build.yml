name: Build LUNA APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # AGP 9.1.x targets API level up to 37; make sure the exact platform
          # and build-tools this project needs are installed before Gradle runs.
          packages: 'platforms;android-36 platforms;android-37 build-tools;36.0.0'

      - name: Write Gemini API key
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luna-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
